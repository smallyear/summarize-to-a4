<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a3a6b"/>
      <stop offset="1" stop-color="#0e2238"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f2f5f9"/>
    </linearGradient>
  </defs>

  <!-- 背景圆角方形 -->
  <rect x="0" y="0" width="1024" height="1024" rx="200" fill="url(#bg)"/>

  <!-- 纸张投影 -->
  <rect x="258" y="168" width="524" height="740" rx="28" fill="#000000" opacity="0.30"/>

  <!-- A4 纸（严格 210:297 比例）+ 屏幕发光边 -->
  <rect x="252" y="152" width="524" height="740" rx="28" fill="url(#paper)" stroke="#7fb3e0" stroke-width="3" stroke-opacity="0.55"/>

  <!-- 标题块 -->
  <rect x="304" y="206" width="420" height="46" rx="8" fill="#1a3a6b"/>
  <rect x="322" y="222" width="180" height="14" rx="7" fill="#ffffff" opacity="0.85"/>

  <!-- 左栏文字线 -->
  <g fill="#d4dbe4">
    <rect x="304" y="282" width="198" height="12" rx="6"/>
    <rect x="304" y="312" width="176" height="12" rx="6"/>
    <rect x="304" y="342" width="190" height="12" rx="6"/>
    <rect x="304" y="372" width="150" height="12" rx="6"/>
    <rect x="304" y="402" width="184" height="12" rx="6"/>
  </g>

  <!-- 右栏文字线 -->
  <g fill="#d4dbe4">
    <rect x="526" y="282" width="198" height="12" rx="6"/>
    <rect x="526" y="312" width="168" height="12" rx="6"/>
    <rect x="526" y="342" width="192" height="12" rx="6"/>
    <rect x="526" y="372" width="140" height="12" rx="6"/>
    <rect x="526" y="402" width="180" height="12" rx="6"/>
  </g>

  <!-- 判级色点（左绿 C / 右粉 ND） -->
  <circle cx="318" cy="470" r="13" fill="#7bb389"/>
  <circle cx="540" cy="470" r="13" fill="#d18a8a"/>

  <!-- 下方更多文字线（延续双栏） -->
  <g fill="#e2e5ea">
    <rect x="304" y="512" width="198" height="12" rx="6"/>
    <rect x="304" y="542" width="160" height="12" rx="6"/>
    <rect x="304" y="572" width="188" height="12" rx="6"/>
    <rect x="526" y="512" width="198" height="12" rx="6"/>
    <rect x="526" y="542" width="172" height="12" rx="6"/>
    <rect x="526" y="572" width="184" height="12" rx="6"/>
  </g>

  <!-- 压缩箭头：多页内容压进这一页（双层叠加示意"压缩"） -->
  <g fill="#ffffff">
    <path d="M 452 44 L 572 44 L 512 116 Z"/>
    <path d="M 452 56 L 572 56 L 512 128 Z" opacity="0.5"/>
  </g>
</svg>
