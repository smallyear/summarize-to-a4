name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  regress:
    name: 回归测试 (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      # 两个 job 并行时，会同时向同一个 apt 源拉 fonts-noto-cjk（61MB），
      # 实测其中一个会卡在「安装系统依赖」十几分钟不结束。串行避开抢带宽。
      max-parallel: 1
      matrix:
        python: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # weasyprint 需要 pango/harfbuzz/cairo；中文要字体，否则渲染成豆腐块
      # ghostscript 用于文字转曲（没它 topdf 会降级并 warning）
      - name: 安装系统依赖
        timeout-minutes: 10
        run: |
          # runner 侧 apt 镜像偶尔会卡住（表现为一直 in_progress）。
          # 加超时 + 重试，避免一个网络抖动把 job 拖到 6 小时上限。
          set -euo pipefail
          sudo apt-get update -o Acquire::Retries=5
          for attempt in 1 2 3; do
            if sudo apt-get install -y --no-install-recommends \
                 -o Acquire::Retries=5 \
                 libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b \
                 libcairo2 libgdk-pixbuf-2.0-0 \
                 fonts-noto-cjk \
                 ghostscript; then
              exit 0
            fi
            echo "apt 安装失败，第 $attempt 次重试…"
            sudo apt-get update -o Acquire::Retries=5 && sleep 10
          done
          echo "apt 安装连续 3 次失败" >&2
          exit 1

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 环境自检
        run: ./scripts/a4 env

      - name: 跑回归测试
        run: python3 regress.py

      # 冒烟测试：真正产出一份 PDF，验证端到端可用（不只是单测）
      # 冒烟测试：真正产出一份 PDF，验证端到端可用（不只是单测）
      - name: 端到端冒烟测试
        run: |
          set -euo pipefail
          mkdir -p /tmp/smoke && cd /tmp/smoke
          # 用 printf 而不是 heredoc：heredoc 正文会被 YAML 缩进污染，
          # 生成的 Markdown 每行带前导空格，会被当成续行/代码块，静默改变结构。
          {
            printf '%s\n' '# 冒烟测试' ''
            printf '%s\n' '## 一、核心结论' ''
            printf '%s\n' '营收 **128.4 亿元**（+18.2%），毛利率 34.2%。' ''
            printf '%s\n' '| 指标 | 2025 |' '|---|---|' '| 营收 | 128.4 |' '| 毛利率 | 34.2% |' ''
            printf '%s\n' '> ! 原材料价格波动可能影响毛利率 1–3 个百分点。'
          } > in.md
          A4="$GITHUB_WORKSPACE/scripts/a4"
          "$A4" render in.md -o out.html --target-pages 1 --title "冒烟测试"
          "$A4" topdf out.html -o out.pdf
          "$A4" verify out.pdf --target-pages 1 --thumb thumb.png
          test -s out.pdf

      - name: 上传 PDF 与缩略图
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-pdf-py${{ matrix.python }}
          path: |
            /tmp/smoke/out.pdf
            /tmp/smoke/thumb.png
          if-no-files-found: warn
